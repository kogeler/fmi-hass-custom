name: Compatibility

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  latest-stable:
    name: Latest Home Assistant stable
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: docker.io/library/python@sha256:1a3c6dbfd2173971abba880c3cc2ec4643690901f6ad6742d0827bae6cefc925
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve, freeze, recreate, and test latest stable
        run: >-
          python .github/scripts/compatibility.py stable
          --bootstrap requirements-bootstrap.txt
          --homeassistant requirements-compatibility-homeassistant.txt
          --direct requirements-compatibility-direct.txt
          --output requirements-compatibility-stable-resolved.txt

  latest-prerelease:
    name: Latest Home Assistant prerelease
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: docker.io/library/python@sha256:1a3c6dbfd2173971abba880c3cc2ec4643690901f6ad6742d0827bae6cefc925
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve, freeze, recreate, and test latest prerelease
        run: >-
          python .github/scripts/compatibility.py prerelease
          --bootstrap requirements-bootstrap.txt
          --homeassistant requirements-compatibility-homeassistant.txt
          --direct requirements-compatibility-direct.txt
          --output requirements-compatibility-prerelease-resolved.txt
