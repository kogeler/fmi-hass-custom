name: Tests and validation

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: docker.io/library/python@sha256:1a3c6dbfd2173971abba880c3cc2ec4643690901f6ad6742d0827bae6cefc925
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install frozen dependencies
        run: |
          python -m pip install --upgrade pip==26.2
          python -m pip install --no-deps -r requirements.txt
          python -m pip check
      - name: Basic lint
        run: python -m ruff check .
      - name: Offline smoke tests
        run: python -m pytest -q
      - name: Live FMI probe
        run: python -m pytest -o addopts= --strict-config --strict-markers -n 0 -m live -q

  hassfest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Hassfest
        uses: home-assistant/actions/hassfest@ab22029681aa532bfe7de5774a9972d67bfbd2c0 # master 2026-07-30

  hacs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main 2026-06-08
        with:
          category: integration
          comment: "false"
