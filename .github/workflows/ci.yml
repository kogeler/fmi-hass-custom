name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_call:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Base branch or commit for the version comparison
        required: true
        default: master
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality:
    name: Confined quality and offline tests
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python for Ruff
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-lint.txt

      - name: Verify rootless Podman
        run: make doctor

      - name: Resolve image cache keys
        id: images
        run: make image-key >> "$GITHUB_OUTPUT"

      - name: Restore toolbox image
        id: toolbox-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .artifacts/images/toolbox.tar
          key: podman-${{ runner.os }}-${{ runner.arch }}-toolbox-${{ steps.images.outputs.toolbox }}

      - name: Restore resolver image
        id: resolver-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .artifacts/images/resolver.tar
          key: podman-${{ runner.os }}-${{ runner.arch }}-resolver-${{ steps.images.outputs.resolver }}

      - name: Load cached toolbox image
        if: steps.toolbox-cache.outputs.cache-hit == 'true'
        run: make image-load-toolbox

      - name: Load cached resolver image
        if: steps.resolver-cache.outputs.cache-hit == 'true'
        run: make image-load-resolver

      - name: Run the Make CI contract
        env:
          RUFF_OUTPUT_FORMAT: github
        run: make ci

      - name: Export toolbox image
        if: steps.toolbox-cache.outputs.cache-hit != 'true'
        run: make image-save-toolbox

      - name: Export resolver image
        if: steps.resolver-cache.outputs.cache-hit != 'true'
        run: make image-save-resolver

      - name: Publish coverage summary
        if: ${{ !cancelled() }}
        run: |
          if [[ -s .artifacts/coverage-report.md ]]; then
            make coverage-report >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' 'Coverage data was not produced by this run.' >> "$GITHUB_STEP_SUMMARY"
          fi

  live-fmi:
    name: Bounded live FMI
    needs: quality
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify rootless Podman
        run: make doctor

      - name: Resolve image cache keys
        id: images
        run: make image-key >> "$GITHUB_OUTPUT"

      - name: Restore toolbox image
        id: toolbox-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .artifacts/images/toolbox.tar
          key: podman-${{ runner.os }}-${{ runner.arch }}-toolbox-${{ steps.images.outputs.toolbox }}

      - name: Load cached toolbox image
        if: steps.toolbox-cache.outputs.cache-hit == 'true'
        run: make image-load-toolbox

      - name: Run parallel bounded live probes
        run: make live

      - name: Export toolbox image
        if: steps.toolbox-cache.outputs.cache-hit != 'true'
        run: make image-save-toolbox

  hassfest:
    name: Hassfest
    needs: quality
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify rootless Podman
        run: make doctor

      - name: Pull immutable hassfest image
        run: make validator-image-hassfest

      - name: Run hassfest against a private source snapshot
        run: make validate-hassfest

  hacs-validation:
    name: HACS validation
    needs: quality
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      INPUT_GITHUB_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      REPOSITORY_REF: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify rootless Podman
        run: make doctor

      - name: Pull immutable HACS validator image
        run: make validator-image-hacs

      - name: Validate the exact source repository and revision
        run: make validate-hacs

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          fail-on-scopes: runtime, development, unknown

      - name: Verify rootless Podman for fork fallback
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: make doctor

      - name: Resolve image cache keys for fork fallback
        if: github.event.pull_request.head.repo.full_name != github.repository
        id: images
        run: make image-key >> "$GITHUB_OUTPUT"

      - name: Restore toolbox image for fork fallback
        if: github.event.pull_request.head.repo.full_name != github.repository
        id: toolbox-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .artifacts/images/toolbox.tar
          key: podman-${{ runner.os }}-${{ runner.arch }}-toolbox-${{ steps.images.outputs.toolbox }}

      - name: Load cached toolbox image for fork fallback
        if: >-
          github.event.pull_request.head.repo.full_name != github.repository &&
          steps.toolbox-cache.outputs.cache-hit == 'true'
        run: make image-load-toolbox

      - name: Audit the frozen fork environment
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: make audit

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - actions
          - python
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          # Preserve the SARIF identities established by the former dedicated
          # workflow so pull requests retain their master alert baseline.
          category: .github/workflows/codeql.yml:analyze/language:${{ matrix.language }}

  compatibility-stable:
    name: Latest Home Assistant stable
    needs: quality
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify rootless Podman
        run: make doctor

      - name: Resolve image cache keys
        id: images
        run: make image-key >> "$GITHUB_OUTPUT"

      - name: Restore resolver image
        id: resolver-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .artifacts/images/resolver.tar
          key: podman-${{ runner.os }}-${{ runner.arch }}-resolver-${{ steps.images.outputs.resolver }}

      - name: Load cached resolver image
        if: steps.resolver-cache.outputs.cache-hit == 'true'
        run: make image-load-resolver

      - name: Resolve, recreate, and test latest stable
        run: make compatibility-stable

  compatibility-prerelease:
    name: Latest Home Assistant prerelease
    needs: quality
    continue-on-error: true
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify rootless Podman
        run: make doctor

      - name: Resolve image cache keys
        id: images
        run: make image-key >> "$GITHUB_OUTPUT"

      - name: Restore resolver image
        id: resolver-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .artifacts/images/resolver.tar
          key: podman-${{ runner.os }}-${{ runner.arch }}-resolver-${{ steps.images.outputs.resolver }}

      - name: Load cached resolver image
        if: steps.resolver-cache.outputs.cache-hit == 'true'
        run: make image-load-resolver

      - name: Resolve, recreate, and test latest prerelease
        run: make compatibility-prerelease

  version:
    name: Version increment
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Check out base version
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: >-
            ${{
              github.event.pull_request.base.sha ||
              github.event.before ||
              inputs.base_ref
            }}
          path: base
          persist-credentials: false

      - name: Check out proposed version
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: source
          persist-credentials: false

      - name: Verify rootless Podman
        working-directory: source
        run: make doctor

      - name: Resolve an unpublished same-version recovery baseline
        id: release-baseline
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          VERSION_PATH: source/.version
        with:
          script: |
            const fs = await import("node:fs/promises");
            const version = (await fs.readFile(process.env.VERSION_PATH, "utf8")).trim();
            if (!/^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/.test(version)) {
              throw new Error(".version is not a stable semantic version");
            }

            try {
              await github.rest.repos.getReleaseByTag({
                ...context.repo,
                tag: version,
              });
              core.setOutput("unpublished_base_version", "");
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            let latestVersion = "0.6.2";
            try {
              const latest = await github.rest.repos.getLatestRelease({
                ...context.repo,
              });
              latestVersion = latest.data.tag_name;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (!/^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/.test(latestVersion)) {
              throw new Error("latest published release is not a stable semantic version");
            }
            core.setOutput("unpublished_base_version", latestVersion);

      - name: Require synchronized version increase
        working-directory: source
        env:
          UNPUBLISHED_BASE_VERSION: ${{ steps.release-baseline.outputs.unpublished_base_version }}
        run: |
          base_version="$(tr -d '\r\n' < ../base/.version)"
          current_version="$(tr -d '\r\n' < .version)"
          if [[ "$current_version" == "$base_version" && -n "$UNPUBLISHED_BASE_VERSION" ]]; then
            base_version="$UNPUBLISHED_BASE_VERSION"
          fi
          make version-check VERSION_ARGS="--base-version $base_version"
