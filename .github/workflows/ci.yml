name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality, offline, and live tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: docker.io/library/python@sha256:1a3c6dbfd2173971abba880c3cc2ec4643690901f6ad6742d0827bae6cefc925
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install frozen dependencies
        run: |
          python -m pip install --upgrade -r requirements-bootstrap.txt
          python -m pip install --no-deps -r requirements.txt
          python -m pip check
      - name: Verify release metadata
        run: python .github/scripts/version.py check
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Lint
        run: |
          python -m ruff check .
          python -m pylint custom_components/fmi/*.py --init-hook='import sys; sys.path.append(".")'
      - name: Type check
        run: python -m mypy
      - name: Offline tests and coverage
        run: >-
          python -m pytest -n 0
          --cov=custom_components.fmi
          --cov-report=term-missing
          --cov-fail-under=95
      - name: Run bounded live FMI probes
        run: >-
          python -m pytest -o addopts=
          --strict-config
          --strict-markers
          -n 0
          -m live
          -q
