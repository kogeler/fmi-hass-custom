name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
      # TEMPORARY: remove after the Dependency Submission smoke test.
      - feat/map-location
  workflow_call:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Base branch or commit for the version comparison
        required: true
        default: master
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality:
    name: Confined quality and offline tests
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python for Ruff
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-lint.txt

      - name: Verify rootless Podman
        run: make doctor

      - name: Resolve image cache keys
        id: images
        run: make image-key >> "$GITHUB_OUTPUT"

      - name: Restore toolbox image
        id: toolbox-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .artifacts/images/toolbox.tar
          key: podman-${{ runner.os }}-${{ runner.arch }}-toolbox-${{ steps.images.outputs.toolbox }}

      - name: Restore resolver image
        id: resolver-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .artifacts/images/resolver.tar
          key: podman-${{ runner.os }}-${{ runner.arch }}-resolver-${{ steps.images.outputs.resolver }}

      - name: Load cached toolbox image
        if: steps.toolbox-cache.outputs.cache-hit == 'true'
        run: make image-load-toolbox

      - name: Load cached resolver image
        if: steps.resolver-cache.outputs.cache-hit == 'true'
        run: make image-load-resolver

      - name: Run the Make CI contract
        env:
          RUFF_OUTPUT_FORMAT: github
        run: make ci

      - name: Export toolbox image
        if: steps.toolbox-cache.outputs.cache-hit != 'true'
        run: make image-save-toolbox

      - name: Export resolver image
        if: steps.resolver-cache.outputs.cache-hit != 'true'
        run: make image-save-resolver

      - name: Publish coverage summary
        if: ${{ !cancelled() }}
        run: |
          if [[ -s .artifacts/coverage-report.md ]]; then
            make coverage-report >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' 'Coverage data was not produced by this run.' >> "$GITHUB_STEP_SUMMARY"
          fi

  live-fmi:
    name: Bounded live FMI
    needs: quality
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify rootless Podman
        run: make doctor

      - name: Resolve image cache keys
        id: images
        run: make image-key >> "$GITHUB_OUTPUT"

      - name: Restore toolbox image
        id: toolbox-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .artifacts/images/toolbox.tar
          key: podman-${{ runner.os }}-${{ runner.arch }}-toolbox-${{ steps.images.outputs.toolbox }}

      - name: Load cached toolbox image
        if: steps.toolbox-cache.outputs.cache-hit == 'true'
        run: make image-load-toolbox

      - name: Run parallel bounded live probes
        run: make live

      - name: Export toolbox image
        if: steps.toolbox-cache.outputs.cache-hit != 'true'
        run: make image-save-toolbox

  validation:
    name: Home Assistant and HACS validation
    needs: quality
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      INPUT_GITHUB_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      REPOSITORY_REF: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify rootless Podman
        run: make doctor

      - name: Resolve image cache keys
        id: images
        run: make image-key >> "$GITHUB_OUTPUT"

      - name: Restore toolbox image
        id: toolbox-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .artifacts/images/toolbox.tar
          key: podman-${{ runner.os }}-${{ runner.arch }}-toolbox-${{ steps.images.outputs.toolbox }}

      - name: Load cached toolbox image
        if: steps.toolbox-cache.outputs.cache-hit == 'true'
        run: make image-load-toolbox

      - name: Pull immutable validator images
        run: make validator-images

      - name: Run confined validators
        run: make validate

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          fail-on-scopes: runtime, development, unknown

      - name: Verify rootless Podman for fork fallback
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: make doctor

      - name: Resolve image cache keys for fork fallback
        if: github.event.pull_request.head.repo.full_name != github.repository
        id: images
        run: make image-key >> "$GITHUB_OUTPUT"

      - name: Restore toolbox image for fork fallback
        if: github.event.pull_request.head.repo.full_name != github.repository
        id: toolbox-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .artifacts/images/toolbox.tar
          key: podman-${{ runner.os }}-${{ runner.arch }}-toolbox-${{ steps.images.outputs.toolbox }}

      - name: Load cached toolbox image for fork fallback
        if: >-
          github.event.pull_request.head.repo.full_name != github.repository &&
          steps.toolbox-cache.outputs.cache-hit == 'true'
        run: make image-load-toolbox

      - name: Audit the frozen fork environment
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: make audit

  dependency-submission:
    name: Submit dependency graph
    # A reusable invocation inherits its caller's workflow name. Requiring the
    # direct CI workflow prevents a second Release snapshot; the Release caller
    # also caps its reusable-workflow token at read-only permissions.
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/master' ||
      github.ref == 'refs/heads/feat/map-location') &&
      github.workflow == 'CI'
    needs: quality
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out trusted submission ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify rootless Podman
        run: make doctor

      - name: Resolve image cache keys
        id: images
        run: make image-key >> "$GITHUB_OUTPUT"

      - name: Restore toolbox image
        id: toolbox-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .artifacts/images/toolbox.tar
          key: podman-${{ runner.os }}-${{ runner.arch }}-toolbox-${{ steps.images.outputs.toolbox }}

      - name: Load cached toolbox image
        if: steps.toolbox-cache.outputs.cache-hit == 'true'
        run: make image-load-toolbox

      - name: Build exact lock manifests without network access
        run: make dependency-snapshot

      - name: Submit all three lock manifests
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = await import("node:fs/promises");
            const snapshot = JSON.parse(
              await fs.readFile(".artifacts/dependency-snapshot.json", "utf8"),
            );
            if (
              !snapshot ||
              typeof snapshot !== "object" ||
              Array.isArray(snapshot) ||
              Object.keys(snapshot).length !== 1 ||
              !snapshot.manifests ||
              typeof snapshot.manifests !== "object" ||
              Array.isArray(snapshot.manifests)
            ) {
              throw new Error("Dependency snapshot has an invalid top-level shape");
            }
            const expected = [
              "requirements-dev.txt",
              "requirements-lint.txt",
              "requirements.txt",
            ];
            const actual = Object.keys(snapshot.manifests).sort();
            if (JSON.stringify(actual) !== JSON.stringify(expected)) {
              throw new Error(`Dependency snapshot has unexpected manifests: ${actual.join(", ")}`);
            }
            for (const name of expected) {
              const manifest = snapshot.manifests[name];
              if (
                manifest?.name !== name ||
                manifest?.file?.source_location !== name ||
                !manifest?.resolved ||
                Object.keys(manifest.resolved).length === 0
              ) {
                throw new Error(`Dependency snapshot has an invalid ${name} manifest`);
              }
            }

            const response = await github.request(
              "POST /repos/{owner}/{repo}/dependency-graph/snapshots",
              {
                ...context.repo,
                version: 0,
                sha: context.sha,
                ref: context.ref,
                job: {
                  correlator: `${context.workflow} ${process.env.GITHUB_JOB}`,
                  id: String(context.runId),
                  html_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                },
                detector: {
                  name: "fmi-hass-custom-pip-locks",
                  version: "1",
                  url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/blob/${context.sha}/.github/scripts/dependency_snapshot.py`,
                },
                scanned: new Date().toISOString(),
                manifests: snapshot.manifests,
                headers: {
                  accept: "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2026-03-10",
                },
              },
            );
            // A non-default branch is recorded but may not update the active
            // repository graph. INVALID remains a hard failure everywhere.
            const acceptedResults = context.ref === "refs/heads/feat/map-location"
              ? new Set(["SUCCESS", "ACCEPTED"])
              : new Set(["SUCCESS"]);
            if (
              response.status !== 201 ||
              !acceptedResults.has(response.data.result)
            ) {
              throw new Error(
                `Dependency submission failed: HTTP ${response.status}, ` +
                `result ${response.data.result}: ${response.data.message}`,
              );
            }
            core.notice(
              `${response.data.message} (result: ${response.data.result})`,
            );

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - actions
          - python
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          # Preserve the SARIF identities established by the former dedicated
          # workflow so pull requests retain their master alert baseline.
          category: .github/workflows/codeql.yml:analyze/language:${{ matrix.language }}

  compatibility-stable:
    name: Latest Home Assistant stable
    needs: quality
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify rootless Podman
        run: make doctor

      - name: Resolve image cache keys
        id: images
        run: make image-key >> "$GITHUB_OUTPUT"

      - name: Restore resolver image
        id: resolver-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .artifacts/images/resolver.tar
          key: podman-${{ runner.os }}-${{ runner.arch }}-resolver-${{ steps.images.outputs.resolver }}

      - name: Load cached resolver image
        if: steps.resolver-cache.outputs.cache-hit == 'true'
        run: make image-load-resolver

      - name: Resolve, recreate, and test latest stable
        run: make compatibility-stable

  compatibility-prerelease:
    name: Latest Home Assistant prerelease
    needs: quality
    continue-on-error: true
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify rootless Podman
        run: make doctor

      - name: Resolve image cache keys
        id: images
        run: make image-key >> "$GITHUB_OUTPUT"

      - name: Restore resolver image
        id: resolver-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .artifacts/images/resolver.tar
          key: podman-${{ runner.os }}-${{ runner.arch }}-resolver-${{ steps.images.outputs.resolver }}

      - name: Load cached resolver image
        if: steps.resolver-cache.outputs.cache-hit == 'true'
        run: make image-load-resolver

      - name: Resolve, recreate, and test latest prerelease
        run: make compatibility-prerelease

  version:
    name: Version increment
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Check out base version
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: >-
            ${{
              github.event.pull_request.base.sha ||
              (github.ref == 'refs/heads/feat/map-location' && 'master') ||
              github.event.before ||
              inputs.base_ref
            }}
          path: base
          persist-credentials: false

      - name: Check out proposed version
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: source
          persist-credentials: false

      - name: Verify rootless Podman
        working-directory: source
        run: make doctor

      - name: Require synchronized version increase
        working-directory: source
        run: |
          base_version="$(tr -d '\r\n' < ../base/.version)"
          make version-check VERSION_ARGS="--base-version $base_version"
