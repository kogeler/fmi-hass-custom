name: Dependency review

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: docker.io/library/python@sha256:1a3c6dbfd2173971abba880c3cc2ec4643690901f6ad6742d0827bae6cefc925
    steps:
      - name: Review dependency changes
        if: github.event.repository.fork == false
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
      - name: Check out fork
        if: github.event.repository.fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install frozen dependencies
        if: github.event.repository.fork
        run: |
          python -m pip install --upgrade -r requirements-bootstrap.txt
          python -m pip install --no-deps -r requirements.txt
          python -m pip check
      - name: Audit frozen fork environment
        if: github.event.repository.fork
        run: python .github/scripts/dependency_audit.py
